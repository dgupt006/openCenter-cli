name: Run pull-request syntax workflows
on:
  - pull_request

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  pre_commit:
    runs-on: self-hosted
    strategy:
      matrix:
        python-version:
          - "3.10"
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up mise
        # Provisions the tools pinned in .mise.toml (notably vale = "3.23.0")
        # onto PATH so the language:system pre-commit hooks (vale prose lint,
        # frontmatter/doc-policy scripts) resolve the same binaries used
        # locally. Mirrors the mise setup in docs-p0.yml.
        uses: jdx/mise-action@v2
        with:
          version: 2026.9.18
          install: true
          cache: true
      - name: Fetch all branches and tags
        run: git fetch --prune --unshallow
      - name: Determine changed files
        id: changed-files
        run: |
          CHANGED_FILES=$(git diff --name-only HEAD^ | xargs)
          echo "Changed files: $CHANGED_FILES"
          echo "CHANGED_FILES=$CHANGED_FILES" >> $GITHUB_ENV
      - name: Run Check
        uses: pre-commit/action@v3.0.1
        with:
          extra_args: >-
            --files ${{ env.CHANGED_FILES }}
            --hook-stage manual
