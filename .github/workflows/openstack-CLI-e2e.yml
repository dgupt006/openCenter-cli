name: OpenStack CLI E2E

# Phase 1 (always runs): init -> provider apply -> generate -> secrets sync
# -> validate-manifests --security-only, entirely local to the runner.
#
# Phase 2 (opt-in via the run_deploy input): creates workflow-owned Swift
# containers and a throwaway GitOps repo, runs a real `cluster deploy` against
# DFW3, and verifies the cluster. Cleanup is a separate explicit opt-in so a
# cluster is preserved for investigation by default during the POC.
#
# Manual trigger only, per Victor's directive to start manual/manual-only.
#
# OCTR-631 (OLM NetworkPolicy hardcoded port 6443) and the Keycloak
# OperatorGroup conflict are both fixed on main as of 2026-08-31/28 - no live
# patch step needs to be baked into deploy for either. The bundle-unpacker
# Job pod zero-egress gap (found independently, not yet filed) is NOT
# covered by either fix and will surface if deploy ever tries to install an
# OLM operator.

on:
  workflow_dispatch:
    inputs:
      region:
        description: "Target OpenStack region"
        required: true
        default: "DFW3"
        type: choice
        options:
          - DFW3
      cluster_name_prefix:
        description: "Prefix for the generated cluster name (a run number is always appended for uniqueness)"
        required: false
        default: "cli-ci-dfw3"
      run_deploy:
        description: "Run cluster deploy against real infrastructure. Leave off for a fast validate-only pass."
        required: true
        type: boolean
        default: false
      cleanup_after_run:
        description: "Explicitly destroy the deployed cluster and workflow-owned resources after testing"
        required: true
        type: boolean
        default: false
      concurrency_slot:
        description: "Deployment slot (two slots allow at most two manually coordinated live clusters)"
        required: true
        type: choice
        default: "1"
        options:
          - "1"
          - "2"

concurrency:
  group: openstack-e2e-${{ inputs.region }}-slot-${{ inputs.concurrency_slot }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 120
    environment: openstack-ci
    env:
      GITOPS_OWNER: dgupt006
      OS_CLOUD: ci-dfw3
      CI_RESULTS_SWIFT_CONTAINER: ${{ vars.CI_RESULTS_SWIFT_CONTAINER || 'opencenter-cli-ci-dfw3-results' }}
      DFW3_EXTERNAL_NETWORK_ID: 82be3711-cd97-4f7c-8bbd-59f5524a949e
      DFW3_IMAGE_ID: 6e3967a7-904a-49c6-870e-d5014c827944
      DFW3_WINDOWS_IMAGE_ID: f0473f97-06db-42ca-8a63-6ecef6f49e08
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Start build timer
        run: |
          set -euo pipefail
          echo "BUILD_STARTED_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
          echo "BUILD_STARTED_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          # This ad-hoc runner can't reach the Actions cache blob storage
          # endpoint (uploads stall at 0%) even though it reaches the GitHub
          # API fine - disable caching here rather than hang the job. Worth
          # asking Pratik whether the org's real runners have this network
          # path open and this one just doesn't.
          cache: false

      - name: Build opencenter binary
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          go build -trimpath -o "$RUNNER_TEMP/bin/opencenter" .
          chmod 0755 "$RUNNER_TEMP/bin/opencenter"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/opencenter" --version

      # Cluster names must never be reused across runs - a reused name can
      # inherit stale ansible fact caches and stale kubeconfig state from an
      # earlier build (see OCTR punch-list). The run number guarantees a
      # fresh name every time.
      - name: Derive unique cluster name
        id: name
        env:
          NAME_PREFIX: ${{ inputs.cluster_name_prefix }}
        run: |
          set -euo pipefail
          case "$NAME_PREFIX" in
            ''|*[!a-z0-9-]*)
              echo "::error::cluster_name_prefix must contain only lowercase letters, numbers, and hyphens"
              exit 1
              ;;
          esac
          name="${NAME_PREFIX}-${{ github.run_number }}-${{ github.run_attempt }}"
          org="${name}-gitops"
          fqdn="${name}.dfw3.k8s.opencenter.cloud"
          echo "CLUSTER_ORG=$org" >> "$GITHUB_ENV"
          echo "cluster_name=$name" >> "$GITHUB_OUTPUT"
          echo "cluster_org=$org" >> "$GITHUB_OUTPUT"
          echo "cluster_id=${org}/${name}" >> "$GITHUB_OUTPUT"
          echo "cluster_fqdn=$fqdn" >> "$GITHUB_OUTPUT"
          echo "gitops_repo=${name}-gitops" >> "$GITHUB_OUTPUT"

      - name: Configure isolated DFW3 application-credential profile
        env:
          CI_OS_APP_CRED_ID: ${{ secrets.CI_OS_DFW3_APP_CRED_ID }}
          CI_OS_APP_CRED_SECRET: ${{ secrets.CI_OS_DFW3_APP_CRED_SECRET }}
        run: |
          set -euo pipefail
          test "$(uname -s)" = Darwin
          for command in gh jq openstack sops tofu kubectl yq; do
            command -v "$command" >/dev/null
          done
          test -n "$CI_OS_APP_CRED_ID"
          test -n "$CI_OS_APP_CRED_SECRET"
          test -r "$HOME/.config/openstack/clouds.yaml"
          auth_url=$(yq -r '.clouds.keystone-dfw3.auth.auth_url // ""' "$HOME/.config/openstack/clouds.yaml")
          test -n "$auth_url"
          clouds_file="$RUNNER_TEMP/openstack-ci-clouds.yaml"
          AUTH_URL="$auth_url" APP_CRED_ID="$CI_OS_APP_CRED_ID" APP_CRED_SECRET="$CI_OS_APP_CRED_SECRET" \
            yq -n '
              .clouds."ci-dfw3".auth.auth_url = strenv(AUTH_URL) |
              .clouds."ci-dfw3".auth.application_credential_id = strenv(APP_CRED_ID) |
              .clouds."ci-dfw3".auth.application_credential_secret = strenv(APP_CRED_SECRET) |
              .clouds."ci-dfw3".auth_type = "v3applicationcredential" |
              .clouds."ci-dfw3".region_name = "DFW3" |
              .clouds."ci-dfw3".interface = "public" |
              .clouds."ci-dfw3".identity_api_version = 3
            ' > "$clouds_file"
          chmod 0600 "$clouds_file"
          echo "OS_CLIENT_CONFIG_FILE=$clouds_file" >> "$GITHUB_ENV"
          OS_CLIENT_CONFIG_FILE="$clouds_file" openstack --os-cloud "$OS_CLOUD" token issue -f value -c expires >/dev/null

      - name: cluster init
        run: |
          set -euo pipefail
          opencenter cluster init "${{ steps.name.outputs.cluster_name }}" \
            --org "$CLUSTER_ORG" \
            --type openstack \
            --force

      - name: Fix up region-dependent fields
        run: |
          set -euo pipefail
          name="${{ steps.name.outputs.cluster_name }}"
          fqdn="${{ steps.name.outputs.cluster_fqdn }}"
          opencenter cluster set "${{ steps.name.outputs.cluster_id }}" \
            opencenter.meta.region=DFW3 \
            opencenter.infrastructure.cloud.openstack.region=DFW3 \
            opencenter.cluster.cluster_fqdn="$fqdn" \
            opencenter.infrastructure.networking.dns_zone_name="$fqdn" \
            opencenter.infrastructure.cloud.openstack.dns_zone_name="$fqdn" \
            opencenter.infrastructure.cloud.openstack.networking.designate.dns_zone_name="$fqdn" \
            opencenter.infrastructure.compute.flavor_bastion=gp.5.2.4 \
            opencenter.infrastructure.compute.flavor_master=gp.5.4.8 \
            opencenter.infrastructure.compute.flavor_worker=gp.5.8.32 \
            opencenter.infrastructure.compute.flavor_worker_windows=gp.5.8.32 \
            opencenter.gitops.base_repo.release= \
            opencenter.gitops.base_repo.branch=main

      # opencenter.services.* is a generic map, so patch only the storage
      # settings for initializer-enabled Loki, Tempo, and Velero. This does
      # not enable any optional application.
      - name: Fix up map-typed service fields
        env:
          CLUSTER_NAME: ${{ steps.name.outputs.cluster_name }}
        run: |
          export CONFIG_PATH="$HOME/.config/opencenter/clusters/blueprints/$CLUSTER_ORG/$CLUSTER_NAME/$CLUSTER_NAME-config.yaml"
          python3 - <<'PYEOF'
          import os

          path = os.environ["CONFIG_PATH"]
          name = os.environ["CLUSTER_NAME"]

          with open(path) as f:
              content = f.read()

          replacements = [
              ("    loki:\n      enabled: true\n      namespace: observability\n",
               "    loki:\n      enabled: true\n      namespace: observability\n"
               "      storage_type: s3\n"
               f"      bucket_name: {name}-loki\n"
               "      s3_endpoint: https://swift.api.dfw3.rackspacecloud.com\n"
               "      s3_region: DFW3\n"
               "      s3_force_path_style: true\n"),
              ("    tempo:\n      enabled: true\n      namespace: observability\n",
               "    tempo:\n      enabled: true\n      namespace: observability\n"
               "      storage_type: s3\n"
               f"      bucket_name: {name}-tempo\n"
               "      s3_endpoint: https://swift.api.dfw3.rackspacecloud.com\n"
               "      s3_region: DFW3\n"
               "      s3_force_path_style: true\n"),
              ("    velero:\n      enabled: true\n      namespace: velero\n",
               "    velero:\n      enabled: true\n      namespace: velero\n"
               f"      backup_bucket: {name}-velero\n"
               "      region: DFW3\n"
               "      s3_endpoint: https://swift.api.dfw3.rackspacecloud.com\n"
               "      s3_region: DFW3\n"
               "      s3_force_path_style: true\n"
               "      storage_type: s3\n"),
          ]

          missing = [old for old, _ in replacements if old not in content]
          if missing:
              print("::error::Expected default-app settings were not found in the generated config:")
              for m in missing:
                  print(f"::error::  {m!r}")
              raise SystemExit(1)

          for old, new in replacements:
              content = content.replace(old, new, 1)

          with open(path, "w") as f:
              f.write(content)

          print("Patched map-typed service fields")
          PYEOF

      - name: Create workflow-owned Swift containers
        if: ${{ inputs.run_deploy }}
        run: |
          set -euo pipefail
          name="${{ steps.name.outputs.cluster_name }}"
          openstack --os-cloud "$OS_CLOUD" container create \
            "${name}-loki" \
            "${name}-tempo" \
            "${name}-velero"

      # Phase 2 creates this repository. Phase 1 still validates the same
      # repository settings locally, but does not create any GitHub resource.
      - name: Create throwaway GitOps repo
        if: ${{ inputs.run_deploy }}
        env:
          GH_TOKEN: ${{ secrets.CI_GITHUB_PAT }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          gh repo create "${GITOPS_OWNER}/${{ steps.name.outputs.gitops_repo }}" \
            --private \
            --description "Ephemeral CI GitOps repo for ${{ steps.name.outputs.cluster_name }} - safe to delete, cleaned up automatically"

      - name: Set the tested GitOps and default-application secrets
        env:
          CI_GITHUB_PAT: ${{ secrets.CI_GITHUB_PAT }}
          CI_EC2_ACCESS_KEY: ${{ secrets.CI_LOKI_TEMPO_S3_ACCESS_KEY }}
          CI_EC2_SECRET_KEY: ${{ secrets.CI_LOKI_TEMPO_S3_SECRET_KEY }}
        run: |
          set -euo pipefail
          test -n "$CI_GITHUB_PAT"
          test -n "$CI_EC2_ACCESS_KEY"
          test -n "$CI_EC2_SECRET_KEY"
          name="${{ steps.name.outputs.cluster_name }}"
          keycloak_password=$(openssl rand -base64 16 | tr -dc 'A-Za-z0-9' | cut -c1-16)
          config_path="$HOME/.config/opencenter/clusters/blueprints/$CLUSTER_ORG/$name/$name-config.yaml"
          S3_CREDENTIAL_ID="$CI_EC2_ACCESS_KEY" yq -i '
            .opencenter.services.loki.s3_credential_id = strenv(S3_CREDENTIAL_ID) |
            .opencenter.services.tempo.s3_credential_id = strenv(S3_CREDENTIAL_ID) |
            .opencenter.services.velero.s3_credential_id = strenv(S3_CREDENTIAL_ID)
          ' "$config_path"
          opencenter cluster set "${{ steps.name.outputs.cluster_id }}" \
            opencenter.gitops.repository.url="https://github.com/${GITOPS_OWNER}/${{ steps.name.outputs.gitops_repo }}.git" \
            opencenter.gitops.repository.branch=main \
            opencenter.gitops.repository.path="clusters/${name}" \
            opencenter.gitops.auth.token.token="$CI_GITHUB_PAT" \
            secrets.loki.s3_access_key_id="$CI_EC2_ACCESS_KEY" \
            secrets.loki.s3_secret_access_key="$CI_EC2_SECRET_KEY" \
            secrets.tempo.access_key="$CI_EC2_ACCESS_KEY" \
            secrets.tempo.secret_key="$CI_EC2_SECRET_KEY" \
            secrets.velero.access_key_id="$CI_EC2_ACCESS_KEY" \
            secrets.velero.secret_access_key="$CI_EC2_SECRET_KEY" \
            secrets.keycloak.admin_password="$keycloak_password"

      - name: cluster provider openstack apply
        run: |
          set -euo pipefail
          opencenter cluster provider openstack apply "${{ steps.name.outputs.cluster_id }}" \
            --os-cloud "$OS_CLOUD" \
            --import-auth \
            --create-internal-network \
            --external-network-id "$DFW3_EXTERNAL_NETWORK_ID" \
            --availability-zone az1 \
            --image-id "$DFW3_IMAGE_ID" \
            --windows-image-id "$DFW3_WINDOWS_IMAGE_ID" \
            --replace \
            --yes

      - name: cluster generate
        run: |
          set -euo pipefail
          opencenter cluster validate "${{ steps.name.outputs.cluster_id }}"
          opencenter cluster generate "${{ steps.name.outputs.cluster_id }}"

      - name: secrets sync
        run: |
          set -euo pipefail
          opencenter secrets sync "${{ steps.name.outputs.cluster_id }}"

      - name: Validate manifests (security only)
        run: |
          set -euo pipefail
          opencenter cluster validate-manifests "${{ steps.name.outputs.cluster_id }}" --security-only

      - name: Commit and push GitOps content
        if: ${{ inputs.run_deploy }}
        env:
          CI_GITHUB_PAT: ${{ secrets.CI_GITHUB_PAT }}
        run: |
          set -euo pipefail
          gitops_dir="$HOME/.config/opencenter/clusters/gitops/${CLUSTER_ORG}"
          cd "$gitops_dir"
          git config user.name "openCenter CI"
          git config user.email "ci-bot@users.noreply.github.com"
          git remote add origin "https://x-access-token:${CI_GITHUB_PAT}@github.com/${GITOPS_OWNER}/${{ steps.name.outputs.gitops_repo }}.git"
          git add -A
          git commit -m "Initial generate for ${{ steps.name.outputs.cluster_name }} (CI)"
          git push -u origin main

      - name: cluster deploy
        if: ${{ inputs.run_deploy }}
        run: |
          set -euo pipefail
          echo "DEPLOY_STARTED_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
          echo "DEPLOY_STARTED_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
          opencenter cluster deploy "${{ steps.name.outputs.cluster_id }}" --yes
          echo "DEPLOY_FINISHED_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
          echo "DEPLOY_FINISHED_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Verify nodes and default applications
        if: ${{ inputs.run_deploy }}
        run: |
          set -euo pipefail
          eval "$(opencenter cluster env "${{ steps.name.outputs.cluster_id }}")"
          kubectl wait --for=condition=Ready nodes --all --timeout=15m

          deadline=$((SECONDS + 1800))
          while (( SECONDS < deadline )); do
            ks_not_ready=$(kubectl get kustomizations.kustomize.toolkit.fluxcd.io -A -o json | jq '[.items[] | select((any(.status.conditions[]?; .type == "Ready" and .status == "True")) | not)] | length')
            hr_not_ready=$(kubectl get helmreleases.helm.toolkit.fluxcd.io -A -o json | jq '[.items[] | select((any(.status.conditions[]?; .type == "Ready" and .status == "True")) | not)] | length')
            if [[ "$ks_not_ready" == 0 && "$hr_not_ready" == 0 ]]; then
              kubectl get nodes
              kubectl get kustomizations.kustomize.toolkit.fluxcd.io -A
              kubectl get helmreleases.helm.toolkit.fluxcd.io -A
              exit 0
            fi
            echo "Waiting for GitOps readiness: kustomizations=$ks_not_ready helmreleases=$hr_not_ready"
            sleep 30
          done
          kubectl get kustomizations.kustomize.toolkit.fluxcd.io -A
          kubectl get helmreleases.helm.toolkit.fluxcd.io -A
          exit 1

      - name: Record Cinder PVC volume IDs before cleanup
        if: ${{ inputs.run_deploy && inputs.cleanup_after_run && always() }}
        continue-on-error: true
        run: |
          set -euo pipefail
          eval "$(opencenter cluster env "${{ steps.name.outputs.cluster_id }}")"
          kubectl get pv -o json | jq -r '.items[] | select(.spec.csi.driver == "cinder.csi.openstack.org") | .spec.csi.volumeHandle' \
            > "$RUNNER_TEMP/ci-cinder-volume-ids"
          kubectl delete kustomizations.kustomize.toolkit.fluxcd.io --all -A --wait=false || true
          kubectl delete helmreleases.helm.toolkit.fluxcd.io --all -A --wait=false || true
          kubectl delete pvc --all -A --wait=false || true
          for attempt in {1..30}; do
            remaining=$(kubectl get pv --no-headers 2>/dev/null | wc -l | tr -d ' ')
            [[ "$remaining" == 0 ]] && break
            echo "Waiting for $remaining PVs to be deleted before infrastructure teardown"
            sleep 10
          done

      - name: cluster destroy
        if: ${{ inputs.run_deploy && inputs.cleanup_after_run && always() }}
        run: |
          set -euo pipefail
          opencenter cluster destroy "${{ steps.name.outputs.cluster_id }}" --force --remove-files

      - name: Remove verified residual Cinder volumes
        if: ${{ inputs.run_deploy && inputs.cleanup_after_run && always() }}
        continue-on-error: true
        run: |
          set -euo pipefail
          volume_file="$RUNNER_TEMP/ci-cinder-volume-ids"
          [[ -f "$volume_file" ]] || exit 0
          while IFS= read -r volume_id; do
            [[ -n "$volume_id" ]] || continue
            status=$(openstack --os-cloud "$OS_CLOUD" volume show "$volume_id" -f value -c status 2>/dev/null || true)
            if [[ "$status" == available ]]; then
              openstack --os-cloud "$OS_CLOUD" volume delete "$volume_id"
            elif [[ -n "$status" ]]; then
              echo "::warning::Not deleting residual volume $volume_id because status is $status"
            fi
          done < "$volume_file"

      - name: Delete workflow-owned Swift containers
        if: ${{ inputs.run_deploy && inputs.cleanup_after_run && always() }}
        continue-on-error: true
        run: |
          set -euo pipefail
          name="${{ steps.name.outputs.cluster_name }}"
          for container in "${name}-loki" "${name}-tempo" "${name}-velero"; do
            openstack --os-cloud "$OS_CLOUD" container delete --recursive "$container" || \
              echo "::warning::Failed to delete Swift container $container"
          done

      - name: Delete throwaway GitOps repo
        if: ${{ inputs.run_deploy && inputs.cleanup_after_run && always() }}
        env:
          GH_TOKEN: ${{ secrets.CI_GITHUB_PAT }}
        run: |
          gh repo delete "${GITOPS_OWNER}/${{ steps.name.outputs.gitops_repo }}" --yes || \
            echo "::warning::Failed to delete throwaway repo ${GITOPS_OWNER}/${{ steps.name.outputs.gitops_repo }} - clean up manually"

      - name: Write timing and result summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          finished_epoch=$(date +%s)
          finished_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          elapsed_seconds=$((finished_epoch - BUILD_STARTED_EPOCH))
          result_dir="$RUNNER_TEMP/opencenter-ci-result"
          mkdir -p "$result_dir"
          {
            echo "status=$JOB_STATUS"
            echo "region=${{ inputs.region }}"
            echo "cluster_id=${{ steps.name.outputs.cluster_id }}"
            echo "run_id=$GITHUB_RUN_ID"
            echo "run_attempt=$GITHUB_RUN_ATTEMPT"
            echo "commit=$GITHUB_SHA"
            echo "run_deploy=${{ inputs.run_deploy }}"
            echo "cleanup_after_run=${{ inputs.cleanup_after_run }}"
            echo "started_utc=$BUILD_STARTED_UTC"
            echo "finished_utc=$finished_utc"
            echo "elapsed_seconds=$elapsed_seconds"
            if [[ -n "${DEPLOY_STARTED_EPOCH:-}" ]]; then
              echo "deploy_started_utc=$DEPLOY_STARTED_UTC"
              if [[ -n "${DEPLOY_FINISHED_EPOCH:-}" ]]; then
                echo "deploy_finished_utc=$DEPLOY_FINISHED_UTC"
                echo "deploy_elapsed_seconds=$((DEPLOY_FINISHED_EPOCH - DEPLOY_STARTED_EPOCH))"
              else
                echo "deploy_finished_utc=incomplete"
                echo "deploy_elapsed_seconds=$((finished_epoch - DEPLOY_STARTED_EPOCH))"
              fi
            fi
          } | tee "$result_dir/summary.txt" >> "$GITHUB_STEP_SUMMARY"
          tar -C "$result_dir" -cf "$RUNNER_TEMP/${GITHUB_RUN_ID}.tar" summary.txt

      - name: Store result in Swift
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail
          result_tar="$RUNNER_TEMP/${GITHUB_RUN_ID}.tar"
          [[ -f "$result_tar" ]] || exit 0
          object_name="job/$(date -u +%Y-%m-%d)/${GITHUB_RUN_ID}.tar"
          openstack --os-cloud "$OS_CLOUD" container create "$CI_RESULTS_SWIFT_CONTAINER" >/dev/null
          openstack --os-cloud "$OS_CLOUD" object create \
            "$CI_RESULTS_SWIFT_CONTAINER" \
            --name "$object_name" \
            "$result_tar" >/dev/null
          echo "Stored result at swift://${CI_RESULTS_SWIFT_CONTAINER}/${object_name}" >> "$GITHUB_STEP_SUMMARY"

      # Local-disk safety net used only when cleanup was explicitly requested.
      # No-op if `cluster destroy --remove-files` already cleaned everything.
      - name: Clean up local cluster state
        if: ${{ inputs.cleanup_after_run && always() }}
        run: |
          set -euo pipefail
          name="${{ steps.name.outputs.cluster_name }}"
          case "$name" in
            cli-ci-*) ;;
            *) echo "::error::Refusing cleanup for unexpected cluster name: $name"; exit 1 ;;
          esac
          rm -rf "$HOME/.config/opencenter/clusters/blueprints/$CLUSTER_ORG/$name"
          rm -rf "$HOME/.config/opencenter/clusters/secrets/$CLUSTER_ORG/$name"
          rm -rf "$HOME/.config/opencenter/clusters/gitops/$CLUSTER_ORG"
