name: OpenStack CLI E2E

# Phase 1 (always runs): init -> provider apply -> generate -> secrets sync
# -> validate-manifests --security-only, entirely local to the runner.
#
# Phase 2 (opt-in via the run_deploy input): creates a throwaway GitOps repo,
# pushes generated manifests to it, runs a real `cluster deploy` against
# SJC3, then `cluster destroy` and deletes the throwaway repo in cleanup
# regardless of how deploy went. Real infra, real cost, ~40+ minutes.
#
# Manual trigger only, per Victor's directive to start manual/manual-only.
#
# OCTR-631 (OLM NetworkPolicy hardcoded port 6443) and the Keycloak
# OperatorGroup conflict are both fixed on main as of 2026-08-31/28 - no live
# patch step needs to be baked into deploy for either. The bundle-unpacker
# Job pod zero-egress gap (found independently, not yet filed) is NOT
# covered by either fix and will surface if deploy ever tries to install an
# OLM operator.

on:
  workflow_dispatch:
    inputs:
      region:
        description: "Target OpenStack region"
        required: true
        default: "SJC3"
        type: choice
        options:
          - SJC3
      cluster_name_prefix:
        description: "Prefix for the generated cluster name (a run number is always appended for uniqueness)"
        required: false
        default: "cli-ci"
      run_deploy:
        description: "Also run cluster deploy + destroy against real infra (~40+ min). Leave off for a fast validate-only pass."
        required: true
        type: boolean
        default: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate:
    runs-on: self-hosted
    timeout-minutes: 90
    env:
      CLUSTER_ORG: opencenter-cli-ci
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          # This ad-hoc runner can't reach the Actions cache blob storage
          # endpoint (uploads stall at 0%) even though it reaches the GitHub
          # API fine - disable caching here rather than hang the job. Worth
          # asking Pratik whether the org's real runners have this network
          # path open and this one just doesn't.
          cache: false

      - name: Build opencenter binary
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          go build -trimpath -o "$RUNNER_TEMP/bin/opencenter" .
          chmod 0755 "$RUNNER_TEMP/bin/opencenter"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/opencenter" --version

      # Cluster names must never be reused across runs - a reused name can
      # inherit stale ansible fact caches and stale kubeconfig state from an
      # earlier build (see OCTR punch-list). The run number guarantees a
      # fresh name every time.
      - name: Derive unique cluster name
        id: name
        run: |
          set -euo pipefail
          name="${{ inputs.cluster_name_prefix }}-${{ github.run_number }}"
          fqdn="${name}.sjc3.k8s.opencenter.cloud"
          echo "cluster_name=$name" >> "$GITHUB_OUTPUT"
          echo "cluster_fqdn=$fqdn" >> "$GITHUB_OUTPUT"
          echo "gitops_repo=${name}-gitops" >> "$GITHUB_OUTPUT"

      - name: Write clouds.yaml
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/openstack"
          cat > "$HOME/.config/openstack/clouds.yaml" <<EOF
          clouds:
            sjc3:
              auth:
                auth_url: ${{ vars.CI_OS_SJC3_AUTH_URL }}
                application_credential_id: ${{ secrets.CI_OS_SJC3_APP_CRED_ID }}
                application_credential_secret: ${{ secrets.CI_OS_SJC3_APP_CRED_SECRET }}
              auth_type: v3applicationcredential
              region_name: SJC3
              interface: public
              identity_api_version: 3
          EOF

      - name: cluster init
        run: |
          set -euo pipefail
          opencenter cluster init "${{ steps.name.outputs.cluster_name }}" \
            --org "$CLUSTER_ORG" \
            --type openstack \
            --force

      - name: Fix up region-dependent fields
        run: |
          set -euo pipefail
          name="${{ steps.name.outputs.cluster_name }}"
          fqdn="${{ steps.name.outputs.cluster_fqdn }}"
          opencenter cluster set "$name" \
            opencenter.meta.region=SJC3 \
            opencenter.infrastructure.cloud.openstack.region=SJC3 \
            opencenter.cluster.cluster_fqdn="$fqdn" \
            opencenter.infrastructure.networking.dns_zone_name="$fqdn" \
            opencenter.infrastructure.cloud.openstack.dns_zone_name="$fqdn" \
            opencenter.infrastructure.cloud.openstack.networking.designate.dns_zone_name="$fqdn" \
            opencenter.infrastructure.compute.flavor_bastion=gp.0.2.4 \
            opencenter.infrastructure.compute.flavor_master=gp.0.4.8 \
            opencenter.infrastructure.compute.flavor_worker=gp.0.4.16 \
            opencenter.infrastructure.compute.flavor_worker_windows=gp.0.4.16

      # opencenter.services.* is a generic map, and `cluster set` can't reach
      # into map-typed fields (setField: "setting nested fields in maps is
      # not supported"). Patch the generated YAML directly instead - same
      # fields fixed by hand for the sjc3cli1/sjc3cli2 builds.
      - name: Fix up map-typed service fields
        env:
          CONFIG_PATH: /Users/dinesh.gupta/.config/opencenter/clusters/blueprints/${{ env.CLUSTER_ORG }}/${{ steps.name.outputs.cluster_name }}/${{ steps.name.outputs.cluster_name }}-config.yaml
          CLUSTER_NAME: ${{ steps.name.outputs.cluster_name }}
        run: |
          python3 - <<'PYEOF'
          import os

          path = os.environ["CONFIG_PATH"]
          name = os.environ["CLUSTER_NAME"]

          with open(path) as f:
              content = f.read()

          replacements = [
              ("suffix: DFW3", "suffix: SJC3"),
              (f"hostname: dashboard.{name}.dfw3.k8s.opencenter.cloud",
               f"hostname: dashboard.{name}.sjc3.k8s.opencenter.cloud"),
              (f"hostname: auth.{name}.dfw3.k8s.opencenter.cloud",
               f"hostname: auth.{name}.sjc3.k8s.opencenter.cloud"),
              (f"hostname: longhorn.{name}.dfw3.k8s.opencenter.cloud",
               f"hostname: longhorn.{name}.sjc3.k8s.opencenter.cloud"),
              (f"http_route_fqdn: alerts.{name}.dfw3.k8s.opencenter.cloud",
               f"http_route_fqdn: alerts.{name}.sjc3.k8s.opencenter.cloud"),
              ("    loki:\n      enabled: true\n      namespace: observability\n",
               "    loki:\n      enabled: true\n      namespace: observability\n"
               "      storage_type: s3\n"
               f"      bucket_name: {name}-loki\n"
               "      s3_endpoint: s3.ap-southeast-4.amazonaws.com\n"
               "      s3_region: ap-southeast-4\n"),
              ("    tempo:\n      enabled: true\n      namespace: observability\n",
               "    tempo:\n      enabled: true\n      namespace: observability\n"
               "      storage_type: s3\n"
               f"      bucket_name: {name}-tempo\n"
               "      s3_endpoint: s3.ap-southeast-4.amazonaws.com\n"
               "      s3_region: ap-southeast-4\n"),
          ]

          missing = []
          for old, new in replacements:
              if old not in content:
                  missing.append(old)
                  continue
              content = content.replace(old, new, 1)

          with open(path, "w") as f:
              f.write(content)

          if missing:
              print("::warning::Some expected patterns were not found in the generated config:")
              for m in missing:
                  print(f"::warning::  {m!r}")
          else:
              print("Patched map-typed service fields")
          PYEOF

      # Phase 2 only: point the cluster at a throwaway GitOps repo before
      # generate/secrets-sync run, since deploy needs Flux to pull from
      # somewhere real. Deleted again in cleanup regardless of outcome.
      - name: Create throwaway GitOps repo
        if: ${{ inputs.run_deploy }}
        env:
          GH_TOKEN: ${{ secrets.CI_GITHUB_PAT }}
        run: |
          set -euo pipefail
          gh repo create "dgupt006/${{ steps.name.outputs.gitops_repo }}" \
            --private \
            --description "Ephemeral CI GitOps repo for ${{ steps.name.outputs.cluster_name }} - safe to delete, cleaned up automatically"

      - name: Point cluster at GitOps repo and set deploy-only secrets
        if: ${{ inputs.run_deploy }}
        env:
          CI_GITHUB_PAT: ${{ secrets.CI_GITHUB_PAT }}
          CI_S3_ACCESS_KEY: ${{ secrets.CI_LOKI_TEMPO_S3_ACCESS_KEY }}
          CI_S3_SECRET_KEY: ${{ secrets.CI_LOKI_TEMPO_S3_SECRET_KEY }}
        run: |
          set -euo pipefail
          name="${{ steps.name.outputs.cluster_name }}"
          keycloak_password=$(openssl rand -base64 16 | tr -dc 'A-Za-z0-9' | cut -c1-16)
          opencenter cluster set "$name" \
            opencenter.gitops.repository.url="https://github.com/dgupt006/${{ steps.name.outputs.gitops_repo }}.git" \
            opencenter.gitops.repository.path="clusters/${name}" \
            opencenter.gitops.auth.token.token="$CI_GITHUB_PAT" \
            secrets.loki.s3_access_key_id="$CI_S3_ACCESS_KEY" \
            secrets.loki.s3_secret_access_key="$CI_S3_SECRET_KEY" \
            secrets.tempo.access_key="$CI_S3_ACCESS_KEY" \
            secrets.tempo.secret_key="$CI_S3_SECRET_KEY" \
            secrets.keycloak.admin_password="$keycloak_password"

      - name: cluster provider openstack apply
        run: |
          set -euo pipefail
          opencenter cluster provider openstack apply "${{ steps.name.outputs.cluster_name }}" \
            --os-cloud sjc3 \
            --import-auth \
            --create-internal-network \
            --external-network-id "${{ vars.CI_OS_SJC3_EXTERNAL_NETWORK_ID }}" \
            --availability-zone az1 \
            --image-id "${{ vars.CI_OS_SJC3_IMAGE_ID }}" \
            --windows-image-id "${{ vars.CI_OS_SJC3_WINDOWS_IMAGE_ID }}" \
            --replace \
            --yes

      - name: cluster generate
        run: |
          set -euo pipefail
          opencenter cluster generate "${{ steps.name.outputs.cluster_name }}"

      - name: secrets sync
        run: |
          set -euo pipefail
          opencenter secrets sync "${{ steps.name.outputs.cluster_name }}"

      - name: Validate manifests (security only)
        run: |
          set -euo pipefail
          opencenter cluster validate-manifests "${{ steps.name.outputs.cluster_name }}" --security-only

      - name: Upload rendered config and manifests
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: opencenter-ci-${{ steps.name.outputs.cluster_name }}
          path: |
            ~/.config/opencenter/clusters/blueprints/${{ env.CLUSTER_ORG }}/${{ steps.name.outputs.cluster_name }}/**
            ~/.config/opencenter/clusters/gitops/${{ env.CLUSTER_ORG }}/**
          retention-days: 14

      - name: Commit and push GitOps content
        if: ${{ inputs.run_deploy }}
        env:
          CI_GITHUB_PAT: ${{ secrets.CI_GITHUB_PAT }}
        run: |
          set -euo pipefail
          gitops_dir="$HOME/.config/opencenter/clusters/gitops/${CLUSTER_ORG}"
          cd "$gitops_dir"
          git config user.name "openCenter CI"
          git config user.email "ci-bot@users.noreply.github.com"
          git remote add origin "https://x-access-token:${CI_GITHUB_PAT}@github.com/dgupt006/${{ steps.name.outputs.gitops_repo }}.git"
          git add -A
          git commit -m "Initial generate for ${{ steps.name.outputs.cluster_name }} (CI)"
          git push -u origin main

      - name: cluster deploy
        if: ${{ inputs.run_deploy }}
        run: |
          set -euo pipefail
          opencenter cluster deploy "${{ steps.name.outputs.cluster_name }}" --yes

      - name: cluster destroy
        if: ${{ inputs.run_deploy && always() }}
        run: |
          set -euo pipefail
          opencenter cluster destroy "${{ steps.name.outputs.cluster_name }}" --force --remove-files

      - name: Delete throwaway GitOps repo
        if: ${{ inputs.run_deploy && always() }}
        env:
          GH_TOKEN: ${{ secrets.CI_GITHUB_PAT }}
        run: |
          gh repo delete "dgupt006/${{ steps.name.outputs.gitops_repo }}" --yes || \
            echo "::warning::Failed to delete throwaway repo dgupt006/${{ steps.name.outputs.gitops_repo }} - clean up manually"

      # Local-disk safety net regardless of path taken above. No-op if
      # `cluster destroy --remove-files` already cleaned everything.
      - name: Clean up local cluster state
        if: always()
        run: |
          set -euo pipefail
          name="${{ steps.name.outputs.cluster_name }}"
          rm -rf "$HOME/.config/opencenter/clusters/blueprints/$CLUSTER_ORG/$name"
          rm -rf "$HOME/.config/opencenter/clusters/secrets/$CLUSTER_ORG/$name"
          rm -rf "$HOME/.config/opencenter/clusters/gitops/$CLUSTER_ORG"
