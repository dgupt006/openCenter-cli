# OpenCenter login theme — logo images (binary).
# Mounted read-only at /opt/keycloak/themes/opencenter/login/resources/img/.
apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-theme-opencenter-img
  namespace: keycloak
  labels:
    app.kubernetes.io/part-of: keycloak
    app.kubernetes.io/component: login-theme
binaryData:
  opencenter-logo-dark.png: 
  opencenter-logo-light.png: 
